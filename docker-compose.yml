services:
  php:
    build: ./docker
    volumes:
      - ./app:/var/www/html/app
    env_file:
      - ./app/.env
    networks:
      - app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: challenge
      MYSQL_USER: challenge
      MYSQL_PASSWORD: challenge
    command: --mysql-native-password=ON
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: challenge
      PMA_PASSWORD: challenge
    depends_on:
      - mysql
    networks:
      - app

networks:
  app:

volumes:
  mysql_data:
