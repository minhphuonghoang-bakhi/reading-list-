services:
  php:
    build: ./docker
    volumes:
      - ./app:/var/www/html/app
    env_file:
      - ./app/.env
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: reading_list
      MYSQL_USER: reading_list
      MYSQL_PASSWORD: secret
    command: --mysql-native-password=ON
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
